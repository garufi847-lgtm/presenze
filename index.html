<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Registro presenze tirocinanti" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Presenze" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Registro Presenze Tirocinanti</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --accent: #e8c547;
      --accent2: #f4a261;
      --text: #f0eee8;
      --text-muted: #8a8a9a;
      --border: rgba(255,255,255,0.08);
      --success: #4ecdc4;
      --danger: #ff6b6b;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Decorative background */
    body::before {
      content: '';
      position: fixed;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(232,197,71,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── HEADER ── */
    header {
      padding: 24px 20px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px);
    }
    .header-inner {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-area h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .logo-area h1 span { color: var(--accent); }
    .logo-area p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .date-badge {
      background: rgba(232,197,71,0.12);
      border: 1px solid rgba(232,197,71,0.25);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    /* ── NAV TABS ── */
    .tabs {
      max-width: 700px;
      margin: 20px auto 0;
      display: flex;
      gap: 4px;
      padding: 0 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── MAIN ── */
    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 20px 100px;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* ── FORM CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title .icon {
      width: 32px; height: 32px;
      background: rgba(232,197,71,0.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full { grid-column: 1 / -1; }
    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      padding: 12px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(232,197,71,0.5);
      box-shadow: 0 0 0 3px rgba(232,197,71,0.08);
    }
    select option { background: var(--surface2); }
    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    .time-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .time-row span {
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #1a1a2e;
      width: 100%;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #f0d060; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(232,197,71,0.3); }
    .btn-primary:active { transform: translateY(0); }

    .btn-danger {
      background: rgba(255,107,107,0.15);
      color: var(--danger);
      padding: 7px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
    }
    .btn-danger:hover { background: rgba(255,107,107,0.25); }

    .btn-export {
      background: rgba(78,205,196,0.15);
      color: var(--success);
      border: 1px solid rgba(78,205,196,0.3);
    }
    .btn-export:hover { background: rgba(78,205,196,0.25); }

    /* ── TIROCINANTI selector ── */
    .tirocinante-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 7px 14px;
      border-radius: 100px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .chip.selected {
      background: rgba(232,197,71,0.18);
      border-color: rgba(232,197,71,0.5);
      color: var(--accent);
    }
    .chip.add-new {
      border-style: dashed;
      color: var(--text-muted);
    }
    .chip.add-new:hover { color: var(--text); border-color: var(--text-muted); }

    /* ── REGISTRO LIST ── */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filters select, .filters input {
      flex: 1;
      min-width: 140px;
    }

    .entry-list { display: flex; flex-direction: column; gap: 12px; }

    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .entry-card:hover { border-color: rgba(255,255,255,0.14); }

    .entry-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .pill {
      background: var(--surface2);
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pill.date { color: var(--accent); background: rgba(232,197,71,0.1); }
    .pill.time { color: var(--success); background: rgba(78,205,196,0.1); }
    .pill.hours { color: var(--accent2); background: rgba(244,162,97,0.1); }

    .entry-lavoro {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      border-left: 2px solid var(--border);
      padding-left: 10px;
    }

    .entry-actions {
      display: flex;
      align-items: flex-start;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .em-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 0.9rem; }

    /* ── STATS PAGE ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--accent);
      line-height: 1;
    }
    .stat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    .tiro-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .tiro-stat-name { font-weight: 500; font-size: 0.9rem; }
    .tiro-stat-hours {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      color: var(--accent);
    }
    .tiro-stat-days { font-size: 0.75rem; color: var(--text-muted); text-align: right; }

    .bar-wrap {
      height: 4px;
      background: var(--surface2);
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    /* ── IMPOSTAZIONI ── */
    .settings-section { margin-bottom: 24px; }
    .settings-section h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .tiro-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .add-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .add-row input { flex: 1; }
    .btn-add {
      background: rgba(232,197,71,0.18);
      color: var(--accent);
      border: 1px solid rgba(232,197,71,0.3);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add:hover { background: rgba(232,197,71,0.3); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 500;
      z-index: 999;
      transition: transform 0.3s ease;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: rgba(78,205,196,0.4); color: var(--success); }

    /* ── BOTTOM NAV ── */
    nav.bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
      z-index: 200;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: none;
      border: none;
      color: var(--text-muted);
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 1.3rem; }
    .nav-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }

    @media (max-width: 420px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-area">
      <h1>Registro <span>Presenze</span></h1>
      <p>Tirocinanti — Negozio</p>
    </div>
    <div class="date-badge" id="headerDate"></div>
  </div>
</header>

<main>
  <!-- ── PAGE: NUOVA PRESENZA ── -->
  <div class="page active" id="page-nuovo">
    <div class="card">
      <div class="card-title">
        <div class="icon">📋</div>
        Registra presenza
      </div>

      <div style="margin-bottom:16px;">
        <label style="display:block;margin-bottom:8px;">Tirocinante</label>
        <div class="tirocinante-chips" id="tiroChips"></div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="inputData" />
        </div>
        <div class="form-group">
          <label>Ore (facoltativo)</label>
          <div class="time-row">
            <input type="time" id="inputOraInizio" placeholder="Inizio" />
            <span>→</span>
            <input type="time" id="inputOraFine" placeholder="Fine" />
          </div>
        </div>
        <div class="form-group full">
          <label>Lavoro svolto</label>
          <textarea id="inputLavoro" placeholder="Descrivi le attività svolte durante il tirocinio..."></textarea>
        </div>
      </div>

      <button class="btn btn-primary" onclick="salvaPresenza()">
        ✓ Salva presenza
      </button>
    </div>
  </div>

  <!-- ── PAGE: REGISTRO ── -->
  <div class="page" id="page-registro">
    <div class="filters">
      <select id="filterTiro" onchange="renderRegistro()">
        <option value="">Tutti i tirocinanti</option>
      </select>
      <input type="month" id="filterMese" onchange="renderRegistro()" />
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <button class="btn btn-export" onclick="esportaCSV()" style="flex:1;">
        📥 Esporta CSV
      </button>
      <button class="btn btn-export" onclick="stampa()" style="flex:1;">
        🖨️ Stampa
      </button>
    </div>
    <div class="entry-list" id="entryList"></div>
  </div>

  <!-- ── PAGE: STATISTICHE ── -->
  <div class="page" id="page-stats">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card">
      <div class="card-title"><div class="icon">👤</div> Per tirocinante</div>
      <div id="tiroStatsList"></div>
    </div>
  </div>

  <!-- ── PAGE: IMPOSTAZIONI ── -->
  <div class="page" id="page-settings">
    <div class="card">
      <div class="settings-section">
        <h3>Tirocinanti</h3>
        <div id="tiroListSettings"></div>
        <div class="add-row">
          <input type="text" id="newTiroName" placeholder="Nome tirocinante..." maxlength="40" />
          <button class="btn-add" onclick="aggiungiTirocinante()">+</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="settings-section">
        <h3>Dati</h3>
        <button class="btn" style="background:var(--surface2);color:var(--text);width:100%;margin-bottom:10px;" onclick="esportaJSON()">
          💾 Backup JSON
        </button>
        <button class="btn" style="background:rgba(255,107,107,0.12);color:var(--danger);width:100%;border:1px solid rgba(255,107,107,0.2);" onclick="resetDati()">
          🗑️ Cancella tutti i dati
        </button>
      </div>
    </div>
    <p style="text-align:center;color:var(--text-muted);font-size:0.75rem;margin-top:16px;">
      Dati salvati localmente sul dispositivo
    </p>
  </div>
</main>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchPage('nuovo', this)">
    <span class="nav-icon">➕</span>
    <span class="nav-label">Nuovo</span>
  </button>
  <button class="nav-item" onclick="switchPage('registro', this)">
    <span class="nav-icon">📄</span>
    <span class="nav-label">Registro</span>
  </button>
  <button class="nav-item" onclick="switchPage('stats', this)">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Statistiche</span>
  </button>
  <button class="nav-item" onclick="switchPage('settings', this)">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">Imposta</span>
  </button>
</nav>

<div id="toast"></div>

<script>
// ── STATE ──
let state = {
  tirocinanti: [],
  presenze: []
};

function loadState() {
  try {
    const s = localStorage.getItem('presenze_state');
    if (s) state = JSON.parse(s);
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('presenze_state', JSON.stringify(state));
}

// ── INIT ──
loadState();
setDefaults();
renderAll();

function setDefaults() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('inputData').value = today;
  document.getElementById('headerDate').textContent = formatDate(today);

  // Default tirocinanti demo
  if (state.tirocinanti.length === 0) {
    state.tirocinanti = ['Mario Rossi', 'Giulia Bianchi'];
    saveState();
  }
}

// ── NAVIGATION ──
function switchPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'registro') { renderRegistro(); renderFilterTiro(); }
  if (name === 'stats') renderStats();
  if (name === 'settings') renderSettings();
}

// ── CHIPS TIROCINANTI ──
let selectedTiro = null;
function renderChips() {
  const container = document.getElementById('tiroChips');
  container.innerHTML = '';
  state.tirocinanti.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedTiro === name ? ' selected' : '');
    chip.textContent = name;
    chip.onclick = () => { selectedTiro = selectedTiro === name ? null : name; renderChips(); };
    container.appendChild(chip);
  });
}

// ── SALVA PRESENZA ──
function salvaPresenza() {
  if (!selectedTiro) { showToast('Seleziona un tirocinante'); return; }
  const data = document.getElementById('inputData').value;
  if (!data) { showToast('Inserisci la data'); return; }
  const lavoro = document.getElementById('inputLavoro').value.trim();
  if (!lavoro) { showToast('Descrivi il lavoro svolto'); return; }

  const oraInizio = document.getElementById('inputOraInizio').value;
  const oraFine = document.getElementById('inputOraFine').value;
  let ore = null;
  if (oraInizio && oraFine) {
    const diff = calcOre(oraInizio, oraFine);
    if (diff > 0) ore = diff;
  }

  const presenza = {
    id: Date.now(),
    tirocinante: selectedTiro,
    data,
    oraInizio: oraInizio || null,
    oraFine: oraFine || null,
    ore,
    lavoro
  };

  state.presenze.unshift(presenza);
  saveState();

  document.getElementById('inputLavoro').value = '';
  document.getElementById('inputOraInizio').value = '';
  document.getElementById('inputOraFine').value = '';

  showToast('✓ Presenza salvata', true);
}

function calcOre(inizio, fine) {
  const [h1, m1] = inizio.split(':').map(Number);
  const [h2, m2] = fine.split(':').map(Number);
  return ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
}

// ── RENDER REGISTRO ──
function renderFilterTiro() {
  const sel = document.getElementById('filterTiro');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Tutti i tirocinanti</option>';
  state.tirocinanti.forEach(t => {
    sel.innerHTML += `<option value="${t}" ${cur===t?'selected':''}>${t}</option>`;
  });
}

function renderRegistro() {
  const tiroFilter = document.getElementById('filterTiro')?.value || '';
  const meseFilter = document.getElementById('filterMese')?.value || '';
  const list = document.getElementById('entryList');

  let filtered = state.presenze;
  if (tiroFilter) filtered = filtered.filter(p => p.tirocinante === tiroFilter);
  if (meseFilter) filtered = filtered.filter(p => p.data.startsWith(meseFilter));

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="em-icon">📭</div>
      <p>Nessuna presenza trovata</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="entry-card" id="entry-${p.id}">
      <div>
        <div class="entry-name">${p.tirocinante}</div>
        <div class="entry-meta">
          <span class="pill date">📅 ${formatDate(p.data)}</span>
          ${p.oraInizio ? `<span class="pill time">🕐 ${p.oraInizio}${p.oraFine ? ' – '+p.oraFine : ''}</span>` : ''}
          ${p.ore ? `<span class="pill hours">⏱ ${p.ore.toFixed(1)}h</span>` : ''}
        </div>
        <div class="entry-lavoro">${p.lavoro}</div>
      </div>
      <div class="entry-actions">
        <button class="btn btn-danger" onclick="eliminaPresenza(${p.id})">✕</button>
      </div>
    </div>
  `).join('');
}

function eliminaPresenza(id) {
  if (!confirm('Eliminare questa presenza?')) return;
  state.presenze = state.presenze.filter(p => p.id !== id);
  saveState();
  renderRegistro();
  showToast('Presenza eliminata');
}

// ── STATS ──
function renderStats() {
  const grid = document.getElementById('statsGrid');
  const total = state.presenze.length;
  const totalOre = state.presenze.reduce((s, p) => s + (p.ore || 0), 0);
  const tiroSet = new Set(state.presenze.map(p => p.tirocinante));
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthCount = state.presenze.filter(p => p.data.startsWith(thisMonth)).length;

  grid.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Presenze totali</div>
      <div class="stat-value">${total}</div>
      <div class="stat-sub">registrazioni</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ore totali</div>
      <div class="stat-value">${totalOre.toFixed(0)}</div>
      <div class="stat-sub">ore di tirocinio</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Questo mese</div>
      <div class="stat-value">${monthCount}</div>
      <div class="stat-sub">presenze</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tirocinanti</div>
      <div class="stat-value">${tiroSet.size}</div>
      <div class="stat-sub">attivi</div>
    </div>
  `;

  const maxOre = Math.max(...state.tirocinanti.map(t =>
    state.presenze.filter(p => p.tirocinante === t).reduce((s, p) => s + (p.ore || 0), 0)
  ), 1);

  document.getElementById('tiroStatsList').innerHTML = state.tirocinanti.map(t => {
    const pp = state.presenze.filter(p => p.tirocinante === t);
    const ore = pp.reduce((s, p) => s + (p.ore || 0), 0);
    const days = pp.length;
    const pct = (ore / maxOre) * 100;
    return `
      <div class="tiro-stat">
        <div>
          <div class="tiro-stat-name">${t}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div>
          <div class="tiro-stat-hours">${ore.toFixed(1)}h</div>
          <div class="tiro-stat-days">${days} giorni</div>
        </div>
      </div>`;
  }).join('');
}

// ── SETTINGS ──
function renderSettings() {
  document.getElementById('tiroListSettings').innerHTML = state.tirocinanti.map((t, i) => `
    <div class="tiro-row">
      <span>${t}</span>
      <button class="btn btn-danger" onclick="rimuoviTirocinante(${i})">✕ Rimuovi</button>
    </div>
  `).join('');
}

function aggiungiTirocinante() {
  const input = document.getElementById('newTiroName');
  const nome = input.value.trim();
  if (!nome) return;
  if (state.tirocinanti.includes(nome)) { showToast('Tirocinante già presente'); return; }
  state.tirocinanti.push(nome);
  saveState();
  input.value = '';
  renderSettings();
  renderAll();
  showToast('✓ Tirocinante aggiunto', true);
}

function rimuoviTirocinante(i) {
  const nome = state.tirocinanti[i];
  if (!confirm(`Rimuovere "${nome}"? Le presenze non verranno eliminate.`)) return;
  state.tirocinanti.splice(i, 1);
  saveState();
  renderSettings();
  renderAll();
}

// ── EXPORT ──
function esportaCSV() {
  const rows = [['Tirocinante','Data','Ora Inizio','Ora Fine','Ore','Lavoro svolto']];
  state.presenze.forEach(p => {
    rows.push([p.tirocinante, p.data, p.oraInizio||'', p.oraFine||'', p.ore||'', `"${p.lavoro.replace(/"/g,'""')}"`]);
  });
  const csv = rows.map(r => r.join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  download(blob, `presenze_${new Date().toISOString().slice(0,10)}.csv`);
  showToast('✓ CSV esportato', true);
}

function esportaJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  download(blob, `backup_presenze_${new Date().toISOString().slice(0,10)}.json`);
  showToast('✓ Backup scaricato', true);
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function stampa() {
  window.print();
}

function resetDati() {
  if (!confirm('Cancellare TUTTI i dati? Questa azione è irreversibile.')) return;
  state = { tirocinanti: [], presenze: [] };
  saveState();
  setDefaults();
  renderAll();
  showToast('Dati cancellati');
}

// ── HELPERS ──
function renderAll() {
  renderChips();
  renderFilterTiro();
}

function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  const months = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}

let toastTimer;
function showToast(msg, success = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (success ? ' success' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2500);
}

// ── SERVICE WORKER registration ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
